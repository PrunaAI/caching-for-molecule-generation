[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mol-cache"
version = "0.1.0"
description = "Public reproduction stack for molecular generation with Pruna mol-caching"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Johanna Sommer" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "tqdm>=4.66",
  "lightning>=2.4",
  "torchmetrics>=1.4",
  "rdkit>=2024.3.1",
  "einops>=0.8",
  "tensordict>=0.5",
  "lmdb>=1.4",
  "rootutils>=1.0",
  "pruna==0.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
mol-cache = "mol_cache.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mol_cache*"]
exclude = ["models*", "tests*", "assets*", "scripts*"]

[tool.setuptools.package-data]
mol_cache = ["conf/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
