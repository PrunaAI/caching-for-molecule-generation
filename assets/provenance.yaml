components:
  semlaflow:
    path: models/semlaflow
    upstream_url: https://github.com/rssrwn/semla-flow
    source_commit: 466524581e841abb4271d64f4a256513a040bac8
    license: MIT
    citation: |
      @inproceedings{irwin2025semlaflow,
        title={SemlaFlow -- Efficient 3D Molecular Generation with Latent Attention and Equivariant Flow Matching},
        author={Ross Irwin and Alessandro Tibo and Jon Paul Janet and Simon Olsson},
        booktitle={AISTATS},
        year={2025}
      }
    local_modifications:
      - Sampling driven by central Hydra-configured mol_cache adapters (SemlaFlowModel)
      - Block-prefix caching support in MolecularCFM / SemlaGenerator
      - Absolute paths replaced by repository-relative resolution via the central CLI
      - Curated to sampling-only subset (training/QM9/alt scripts removed)

  tabasco:
    path: models/tabasco
    upstream_url: https://github.com/carlosinator/tabasco
    source_commit: 097eaae106e90a88294a93d42a3f91f1798f383f
    license: MIT
    citation: |
      @article{vonessen2025tabasco,
        title={TABASCO: A Fast, Simplified Model for Molecular Generation with Improved Physical Quality},
        author={Carlos Vonessen and Charles Harris and Miruna Cretu and Pietro Liò},
        year={2025},
        url={https://arxiv.org/abs/2507.00899}
      }
    local_modifications:
      - Sampling driven by central Hydra-configured mol_cache adapters (TabascoModel)
      - Processed GEOM tensors excluded from the source tree (see assets/README.md)
      - Curated to sampling-only subset (training configs, wandb logs, guided sampling removed)

  flowr:
    path: models/flowr
    upstream_url: https://github.com/jule-c/flowr
    source_commit: bbb8bfb4e8d8dd16bff1d56a7f96246920e643ba
    license: MIT
    citation: |
      @misc{cremer2025flowr,
        title={FLOWR: Flow Matching for Structure-Aware De Novo, Interaction- and Fragment-Based Ligand Generation},
        author={Julian Cremer and Ross Irwin and Alessandro Tibot and Jon Paul Janet and Simon Olsson and Djork-Arné Clevert},
        year={2025},
        eprint={2504.10564},
        archivePrefix={arXiv}
      }
    local_modifications:
      - Python package renamed flowr → flowr_model for in-process coexistence with FLOWR.root
      - Sampling driven by central Hydra-configured mol_cache adapters (FlowrModel)
      - Datasets, checkpoints, ADFRsuite, and genbench3d_data excluded from source tree
      - LICENSE file added for redistribution clarity (README claimed MIT)
      - Curated to sampling-only subset
      - Leftover evaluation entry points removed (see removed_evaluation_files)
      - Bundled evaluation suites removed (see removed_vendored_suites)
      - README setup steps for ADFR / genbench3d_data marked not-applicable
    removed_evaluation_files:
      # Standalone metric/interaction evaluation scripts; no importer reachable
      # from FlowrModel or any other sampling adapter.
      - flowr_model/eval/evaluate_interactions.py
      - flowr_model/eval/evaluate_metrics.py
      - flowr_model/eval/evaluate_util.py
    removed_vendored_suites:
      # Third-party evaluation packages that upstream FLOWR carried in-tree.
      # models/flowr is prepended to sys.path, so each vendored copy shadowed
      # any installed distribution of the same name.
      - name: PoseBusters
        path: posebusters/
        replaced_by: posebusters==0.3.1 from PyPI (pinned in environment.yml)
        rationale: >-
          Vendored tree was identical to the published 0.3.1 package, so it
          shadowed the pinned dependency with a redundant copy.
      - name: PoseCheck
        path: posecheck/
        replaced_by: posecheck==1.3.1 from PyPI (pinned in environment.yml)
        rationale: >-
          Vendored tree matched the published 1.3.1 package apart from import
          formatting in posecheck.py; no functional local changes to preserve.
      - name: GenBench3D
        path: genbench3d/
        replaced_by: none - no PyPI distribution exists
        rationale: >-
          Benchmark-only suite. Every entry point that reached it also required
          the genbench3d_data archive and the ADFR prepare_receptor binary,
          neither of which is shipped here, so the code paths were already
          inoperable in this repository.

  flowr_root:
    path: models/flowr_root
    upstream_url: https://github.com/jule-c/flowr_root
    source_commit: 066b3c878b4693d156e5445a0f175e49a5cae3de
    license: MIT
    citation: |
      @misc{cremer2025flowrroot,
        title={FLOWR.root: A flow matching based foundation model for joint multi-purpose structure-aware 3D ligand generation and affinity prediction},
        author={Julian Cremer and Tuan Le and Mohammad M. Ghahremanpour and Emilia Sługocka and Filipe Menezes and Djork-Arné Clevert},
        year={2025},
        eprint={2510.02578},
        archivePrefix={arXiv}
      }
    local_modifications:
      - Python package renamed flowr → flowr_root_model for in-process coexistence with FLOWR
      - Sampling driven by central Hydra-configured mol_cache adapters (FlowrRootModel)
      - Datasets and checkpoints excluded from source tree
      - OpenEye / Schrödinger dependencies removed from the public sampling profile
      - LICENSE file added for redistribution clarity (README claimed MIT)
      - Curated to sampling-only subset (flowr_vis, examples, training/OE scripts removed)
      - Leftover evaluation entry points removed (see removed_evaluation_files)
    removed_evaluation_files:
      # Standalone evaluation helpers with no importer reachable from
      # FlowrRootModel. Sibling eval/evaluate_pose.py is retained because
      # flowr_root_model/util/metrics.py imports shape_tanimoto_similarity.
      - flowr_root_model/eval/evaluate_util.py

# Record of the post-refactor evaluation-code cleanup.
#
# This stack is sampling-only: mol_cache/sample.py never computes metrics.
# Each path under a component's `removed_evaluation_files` was verified to have
# no importer reachable from any of the four sampling adapters, and no
# reference from a Hydra `_target_` or other dynamic-import site.
evaluation_cleanup:
  method: >-
    Import closure computed from mol_cache/ and the four mol_cache_sampler.py
    adapters, cross-checked against Hydra `_target_` strings and dynamic
    imports. Vendored suites were compared file-by-file against the pinned PyPI
    distributions before being dropped. After every removal, all four sampling
    adapters and both util/metrics.py modules still import cleanly and the
    PoseBusters-backed helpers were exercised on an RDKit molecule.

  no_files_removed:
    # Their evaluation-flavoured modules are load-bearing (see retained, below).
    - semlaflow
    - tabasco

  # Evaluation-oriented code deliberately KEPT: each is imported at module
  # scope by core sampling code, so removing it is a refactor rather than a
  # file deletion. Listed with the importer that makes it load-bearing.
  retained:
    - path: models/flowr/flowr_model/util/metrics.py
      required_by: flowr_model/models/fm_pocket.py (ALLOWED_VALENCIES, _is_valid_valence)
    - path: models/flowr_root/flowr_root_model/util/metrics.py
      required_by: flowr_root_model/models/{fm_pocket,mol_builder}.py (valence tables)
    - path: models/flowr_root/flowr_root_model/eval/evaluate_pose.py
      required_by: flowr_root_model/util/metrics.py (shape_tanimoto_similarity)
    - path: models/tabasco/src/tabasco/utils/metrics.py
      required_by: tabasco/models/lightning_tabasco.py
    - path: models/tabasco/src/tabasco/utils/metric_utils.py
      required_by: tabasco/flow/interpolate.py, tabasco/models/components/losses.py

  # Dropping the bundled GenBench3D suite required deleting the code that
  # imported it, since no replacement distribution exists. Everything listed
  # here was already unreachable from the sampling adapters.
  genbench3d_code_removals:
    - file: models/flowr/flowr_model/util/metrics.py
      removed:
        - six genbench3d import statements
        - class GenBench3DValidity
        - class GenBench3DSB
        - function setup_minimize (ADFR receptor prep + ComplexMinimizer)
        - function evaluate_gb3_validity
        - function evaluate_gbsb3
        - function evaluate_gbsb3_list
      signature_changes:
        # setup_minimize was the only reason these took ref_lig/minimize/config.
        - evaluate_pb_validity dropped the ref_lig, minimize and config parameters
        - evaluate_pb_validity_list dropped the ref_ligs, minimize and config parameters
    - file: models/flowr/flowr_model/scriptutil.py
      removed:
        - genbench3d metric wiring in init_metrics
        - function init_sbdd_metrics
        - now-unused import yaml

  dependency_changes:
    # AutoDock Vina was pulled in only by genbench3d's VinaProtein / vina_scorer.
    - environment.yml no longer requests the conda `vina` package
    - posebusters and posecheck are now used from PyPI rather than shadowed by vendored copies

  # Final sweep: once the evaluation entry points were gone, the helper code
  # they were the sole callers of became unreachable too.
  dead_code_sweep:
    method: >-
      Top-level definitions in the four files below were pruned by iterating
      symbol reachability to a fixpoint. Every other file in the repository was
      treated as fully live, so any reference from outside kept a definition.
      Repeated until no dead definitions remained, then unused imports were
      dropped with `ruff --select F401` and F821 confirmed no dangling names.
    files:
      - path: models/flowr/flowr_model/util/metrics.py
        definitions_removed: 33
        lines: 1914 -> 488
      - path: models/flowr/flowr_model/scriptutil.py
        definitions_removed: 7
        lines: 620 -> 403
      - path: models/flowr_root/flowr_root_model/util/metrics.py
        definitions_removed: 38
        lines: 2126 -> 665
      - path: models/flowr_root/flowr_root_model/scriptutil.py
        definitions_removed: 17
        lines: 3119 -> 916
    categories:
      - Evaluation helpers whose only callers were the deleted eval/ scripts
        (evaluate_mol_metrics, evaluate_statistics, evaluate_strain,
        evaluate_clashes, evaluate_posecheck, interaction recovery, and the
        per-molecule property calculators they fed)
      - Torchmetrics classes reachable only from the removed init_metrics
        (AtomStability, MoleculeStability, InteractionAccuracy,
        InteractionRecovery, PocketValidity)
      - Training and data-module construction in FLOWR.root scriptutil
        (build_model, build_dm, load_dm, build_trainer, train_val_test_split
        and related helpers), already out of scope for a sampling-only stack
    notes:
      # Name-based reachability could not see this one: FLOWR.root defines a
      # live class of the same name, so the FLOWR copy looked referenced.
      - FLOWR's PoseBustersValidity was removed after a package-scoped check
      - FLOWR.root metrics.py contained two calc_strain definitions; the
        shadowed first copy only became visible after the second was removed
      - >-
        posebusters and posecheck remain required: FLOWR.root's
        PoseBustersValidity is built in fm_pocket, and Tabasco's metrics use
        both PoseBusters and posecheck.utils.strain.
